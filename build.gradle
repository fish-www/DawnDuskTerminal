plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArguments.addAll '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', project.file('src/generated/resources').absolutePath, '--existing', project.file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll '--nogui'
        }
    }

    mods {
        "dawnduskterminal" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // GeckoLib 的坐标只存在于它自己的 maven，用 exclusiveContent 把这一组从其余源里摘出来：
    // ModDevGradle 会把 maven.neoforged.net 加进仓库列表，而那个源在部分网络下连不上（连接超时），
    // 只要 Gradle 去问过它一次，整个 compileClasspath 解析就会失败
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
    // 暮色森林只有 CurseMaven 一条路：它自己的 modmaven 停更在 2024-07-06（最新 4.5.2428），
    // 1.21.1 现在用的 4.8.3345 在那个源上只有空目录。同样是第三方源，同样用 exclusiveContent 摘出来
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
    mavenLocal()
}

// 两个前置模组都用 compileOnly 加 runtimeOnly：
// compileOnly 供编译，runtimeOnly 让 runClient runServer runData 这些开发运行也加载它们
// 它们都是普通模组，运行时必须装在游戏端，jar 不会被打进本模组的产物
dependencies {
    // 4.9.3 是 1.21.1 线上当前的版本，它声明 neoforge >= 21.1.150，本项目满足
    // GeckoLib 另有一个 geckoanimfix 是 incompatible 依赖，两者不能同时装
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // 坐标是「项目 id 加 file id」，7797302 对应 CurseForge 上 1.21.1 的 4.8.3345
    compileOnly 'curse.maven:the-twilight-forest-227639:7797302'
    runtimeOnly 'curse.maven:the-twilight-forest-227639:7797302'
}

def twilightDependency = providers.gradleProperty('twilight_dependency').getOrElse('required')

def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    neo_version_range      : neo_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    twilight_dependency    : twilightDependency,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : mod_authors,
        ])
    }
}
